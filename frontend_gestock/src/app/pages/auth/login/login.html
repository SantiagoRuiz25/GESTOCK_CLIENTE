<div class="login-card" *ngIf="!mostrarModalRol">
  <button class="btn-back">← Volver al inicio</button>
  
  <div class="brand-badge">
    📦 Gestock
  </div>

  <h2>Iniciar Sesión</h2>
  <p class="subtitle">Ingresa tus datos para acceder al sistema de gestión.</p>

  <form [formGroup]="loginForm" (ngSubmit)="procesarLogin()">
    <div class="form-group">
      <label>Correo Electrónico</label>
      <div class="input-wrapper">
        <span class="icon">✉️</span>
        <input type="email" formControlName="email" placeholder="correo@ejemplo.com" />
      </div>
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <div class="input-wrapper">
        <span class="icon">🔒</span>
        <input type="password" formControlName="password" placeholder="••••••••" />
      </div>
    </div>

    <div class="form-options">
      <label class="checkbox-label">
        <input type="checkbox" formControlName="recordar" /> Recordar este dispositivo
      </label>
      <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
    </div>

    <button type="submit" class="btn-submit" [disabled]="loginForm.invalid">
      Acceder a la Plataforma →
    </button>
  </form>
</div>

<!-- Modal para Seleccionar Tipo de Acceso / Rol -->
<div class="modal-backdrop" *ngIf="mostrarModalRol">
  <div class="role-modal-card">
    <div class="modal-badge">🔐 Configuración de Acceso</div>
    <h3>¿Cómo deseas ingresar?</h3>
    <p class="modal-subtitle">Detectamos que estás accediendo con un usuario secundario ({{ loginForm.value.email }}). Elige tu perfil de trabajo:</p>

    <div class="role-options">
      <!-- Opción 1: Modo Administrador de Empresa -->
      <button class="role-card" (click)="confirmarAcceso('admin')">
        <div class="role-icon">🛡️</div>
        <div class="role-info">
          <h4>Ingresar como Administrador</h4>
          <p>Acceso total a configuraciones, reportes y gestión de la empresa.</p>
        </div>
      </button>

      <!-- Opción 2: Modo Usuario Estándar / Operador -->
      <button class="role-card" (click)="confirmarAcceso('usuario')">
        <div class="role-icon">👤</div>
        <div class="role-info">
          <h4>Ingresar como Usuario Nuevo / Estándar</h4>
          <p>Acceso restringido a tareas operativas diarias e inventario básico.</p>
        </div>
      </button>
    </div>

    <button class="btn-cancel-modal" (click)="cancelarSeleccionRol()">
      ← Regresar al login
    </button>
  </div>
</div>
