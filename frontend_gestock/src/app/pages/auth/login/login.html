<div class="auth-wrapper">
  <div 
    class="login-card" 
    (mousemove)="onMouseMove($event)"
    [style.--mouse-x.px]="mouseX"
    [style.--mouse-y.px]="mouseY">
    
    <!-- Header -->
    <div class="card-header">
      <div class="brand-badge">
        <span class="icon">📦</span>
        <span>Gestock</span>
      </div>
      <h1>Iniciar Sesión</h1>
      <p class="subtitle">Ingresa tus datos para acceder al sistema de gestión.</p>
    </div>

    <!-- Contenedor del Formulario -->
    <div class="login-form">
      
      <!-- Correo -->
      <div class="form-group" [class.is-focused]="activeField === 'email'">
        <label for="email">Correo Electrónico</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input 
            type="text" 
            id="email" 
            [(ngModel)]="credentials.email" 
            name="email"
            placeholder="usuario@gestock.com"
            (focus)="setFocus('email')"
            (blur)="clearFocus()">
        </div>
      </div>

      <!-- Contraseña -->
      <div class="form-group" [class.is-focused]="activeField === 'password'">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input 
            type="password" 
            id="password" 
            [(ngModel)]="credentials.password" 
            name="password"
            placeholder="••••••••"
            (focus)="setFocus('password')"
            (blur)="clearFocus()">
        </div>
        <div class="forgot-password-container">
          <a routerLink="/auth/recuperar-contrasena" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>
      </div>

      <!-- Recordar -->
      <div class="form-actions">
        <label class="remember-me">
          <input 
            type="checkbox" 
            [(ngModel)]="credentials.rememberMe" 
            name="rememberMe">
          <span>Recordar este dispositivo</span>
        </label>
      </div>

      <!-- Alerta de Errores Comunes -->
      <div *ngIf="errorMessage" class="error-banner" style="background-color: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 4px; text-align: center; font-weight: 500;">
        {{ errorMessage }}
      </div>

      <!-- Botón Principal -->
      <button type="button" class="btn-primary" [disabled]="isLoading" (click)="onLogin()">
        <span *ngIf="!isLoading">Acceder a la Plataforma &rarr;</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>

    </div>

    <!-- Divisor -->
    <div class="divider">
      <span>o continúa con</span>
    </div>

    <!-- Google Button -->
    <button type="button" class="google-btn" (click)="loginWithGoogle()">
      <svg class="google-icon" width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>Continuar con Google</span>
    </button>

    <!-- Footer -->
    <div class="card-footer">
      <p>¿No tienes una cuenta aún? <a routerLink="/auth/crear-usuario" class="register-link">Crear cuenta</a></p>
    </div>

  </div>
</div>
