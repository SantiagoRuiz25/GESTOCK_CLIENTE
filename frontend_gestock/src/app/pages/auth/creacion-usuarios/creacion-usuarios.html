<div class="auth-container">
  <div class="apple-card auth-card">
    <div class="card-header">
      <div class="brand-logo">📦 Gestock</div>
      <h1>Creación de Usuario</h1>
      <p class="subtitle">Registra nuevos miembros y asigna permisos dentro de la plataforma.</p>
    </div>

    <!-- PASO 1: Formulario de Registro (HU001, HU002, HU003) -->
    <form *ngIf="pasoActual === 1" (ngSubmit)="solicitarRegistro()" class="apple-form">
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <div class="input-container">
          <input type="text" id="nombre" name="nombre" [(ngModel)]="nuevoUsuario.nombre" placeholder="Ej. Carlos Mendoza" required>
        </div>
      </div>

      <div class="form-group">
        <label for="correo">Correo Electrónico</label>
        <div class="input-container">
          <input type="email" id="correo" name="correo" [(ngModel)]="nuevoUsuario.correo" placeholder="usuario@gestock.com" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña Inicial</label>
        <div class="input-container">
          <input type="password" id="password" name="password" [(ngModel)]="nuevoUsuario.password" placeholder="••••••••" required>
        </div>
      </div>

      <div class="form-group">
        <label for="rol">Asignación de Rol (HU003)</label>
        <div class="select-container">
          <select id="rol" name="rol" [(ngModel)]="nuevoUsuario.rol">
            <option *ngFor="let rol of roles" [value]="rol">{{ rol }}</option>
          </select>
        </div>
      </div>

      <button type="submit" class="apple-btn-primary">
        <span>Enviar Código de Verificación</span>
        <span class="btn-arrow">&rarr;</span>
      </button>
    </form>

    <!-- PASO 2: Verificación de Código por Correo (HU004) -->
    <div *ngIf="pasoActual === 2" class="verification-step">
      <div class="info-box">
        <span class="info-icon">✉️</span>
        <p>Hemos enviado un código de confirmación a <strong>{{ nuevoUsuario.correo }}</strong></p>
      </div>

      <div class="form-group">
        <label for="codigo">Código de Verificación (6 dígitos)</label>
        <div class="input-container">
          <input type="text" id="codigo" name="codigo" [(ngModel)]="codigoVerificacion" maxlength="6" placeholder="123456" class="code-input">
        </div>
      </div>

      <button type="button" class="apple-btn-primary" (click)="confirmarCodigo()">
        <span>Completar Registro</span>
      </button>
      <button type="button" class="btn-link" (click)="pasoActual = 1">Volver atrás</button>
    </div>
  </div>
</div>
