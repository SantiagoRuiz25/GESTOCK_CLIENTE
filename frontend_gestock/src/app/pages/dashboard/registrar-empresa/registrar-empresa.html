<div class="registro-layout">
  <div class="registro-card">
    <div class="card-header">
      <h2>Registrar Nueva Empresa</h2>
      <p class="subtitle">Configure los datos iniciales de su organización para acceder al sistema Gestock.</p>
    </div>

    <!-- Se elimina (ngSubmit) para evitar bloqueos del formulario -->
    <div>
      <div class="form-group">
        <label for="nombre">Nombre de la Empresa</label>
        <input id="nombre" type="text" #nombreInput placeholder="Ej. Mi Empresa SAS" value="CATEGORIA PRODUCTO 1" />
      </div>

      <div class="form-group">
        <label for="email">Email de contacto</label>
        <input id="email" type="email" #emailInput placeholder="contacto@empresa.com" value="ericksantiago7p@gmail.com" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="moneda">Moneda</label>
          <select id="moneda" #monedaSelect>
            <option value="USD - Dólar">USD - Dólar</option>
            <option value="COP - Peso Colombiano">COP - Peso Colombiano</option>
          </select>
        </div>

        <div class="form-group">
          <label for="formatoFecha">Formato de Fecha</label>
          <select id="formatoFecha" #fechaSelect>
            <option value="DD/MM/YYYY">DD/MM/YYYY</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button 
          type="button" 
          class="btn-primary-action" 
          (click)="crearYSalir(nombreInput.value, emailInput.value, monedaSelect.value, fechaSelect.value)"
        >
          Crear Empresa →
        </button>
      </div>
    </div>
  </div>
</div>
