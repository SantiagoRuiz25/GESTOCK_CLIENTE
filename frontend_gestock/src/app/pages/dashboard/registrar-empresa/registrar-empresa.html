<div class="modal-overlay">
  <div class="modal-card">
    
    <div class="modal-header">
      <h3>Registrar Nueva Empresa</h3>
    </div>

    <p class="modal-subtitle">Configure los datos iniciales de su organización para acceder al sistema Gestock.</p>

    <div *ngIf="errorMessage()" class="alert-error">
      {{ errorMessage() }}
    </div>

    <form [formGroup]="empresaForm" (ngSubmit)="guardarEmpresa()" class="modal-form">
      
      <div class="form-group">
        <label>Nombre de la Empresa</label>
        <input 
          type="text" 
          formControlName="nombre" 
          placeholder="Nombre comercial..." 
          class="form-control" 
          [ngClass]="{'is-invalid': empresaForm.get('nombre')?.invalid && empresaForm.get('nombre')?.touched}"
        />
        <div *ngIf="empresaForm.get('nombre')?.invalid && empresaForm.get('nombre')?.touched" class="error-text">
          El nombre es obligatorio (mínimo 2 caracteres).
        </div>
      </div>

      <div class="form-group">
        <label>Email de contacto</label>
        <input 
          type="email" 
          formControlName="email" 
          placeholder="correo@empresa.com" 
          class="form-control" 
          [ngClass]="{'is-invalid': empresaForm.get('email')?.invalid && empresaForm.get('email')?.touched}"
        />
        <div *ngIf="empresaForm.get('email')?.invalid && empresaForm.get('email')?.touched" class="error-text">
          Ingrese un correo electrónico válido.
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Moneda</label>
          <select formControlName="moneda" class="form-control">
            <option value="USD - Dólar">USD - Dólar</option>
            <option value="COP - Peso Colombiano">COP - Peso Colombiano</option>
            <option value="EUR - Euro">EUR - Euro</option>
          </select>
        </div>

        <div class="form-group">
          <label>Formato de Fecha</label>
          <select formControlName="formatoFecha" class="form-control">
            <option value="DD/MM/YYYY">DD/MM/YYYY</option>
            <option value="YYYY-MM-DD">YYYY-MM-DD</option>
            <option value="MM/DD/YYYY">MM/DD/YYYY</option>
          </select>
        </div>
      </div>

      <div class="modal-actions">
        <button type="submit" class="btn-crear" [disabled]="isLoading()">
          {{ isLoading() ? 'Creando...' : 'Crear Empresa' }}
        </button>
      </div>

    </form>

  </div>
</div>
